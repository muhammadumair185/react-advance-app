name: React Advance CI

# Workflow kab trigger hoga
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Code ko repository se checkout karna
    - name: Checkout code
      uses: actions/checkout@v3

    # Node.js ka version setup karna
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Dependencies install karna
    - name: Install dependencies
      run: npm install

    # Application build karna
    - name: Build application
      run: npm run build

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    # Tests run karna
    - name: Run tests
      run: npm run test -- --watchAll=false
